<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagination Example</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 600px;">
  <h4 class="mb-4 text-center">Pagination Demo</h4>

  <div id="pageContent" class="p-4 bg-white border rounded mb-4" style="min-height: 150px;">
    
  </div>

  <nav aria-label="Page navigation">
    <ul class="pagination justify-content-center" id="pagination">
    
    </ul>
  </nav>
</div>

<script>
  const totalPages = 5;
  let currentPage = 1;

  const contentEl = document.getElementById('pageContent');
  const paginationEl = document.getElementById('pagination');

  function renderContent() {
    contentEl.innerHTML = `<h5>Page ${currentPage}</h5><p>This is the content for page ${currentPage} of ${totalPages}.</p>`;
  }

  function renderPagination() {
    let html = '';


    html += `
      <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
        <a class="page-link" href="#" data-page="${currentPage - 1}">Previous</a>
      </li>`;

    
    for (let i = 1; i <= totalPages; i++) {
      html += `
        <li class="page-item ${i === currentPage ? 'active' : ''}">
          <a class="page-link" href="#" data-page="${i}">${i}</a>
        </li>`;
    }

    
    html += `
      <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
        <a class="page-link" href="#" data-page="${currentPage + 1}">Next</a>
      </li>`;

    paginationEl.innerHTML = html;
  }

  paginationEl.addEventListener('click', function (e) {
    e.preventDefault();
    const target = e.target.closest('.page-link');
    if (!target) return;

    const page = parseInt(target.getAttribute('data-page'));
    if (page >= 1 && page <= totalPages) {
      currentPage = page;
      renderContent();
      renderPagination();
    }
  });

  renderContent();
  renderPagination();
</script>

</body>
</html>
