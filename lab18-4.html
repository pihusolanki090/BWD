<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <!-- wap that displays the multiplication table of a number using function -->
</body>
    <script>

        function multipletable()
        {
            var number = prompt("Enter a number:");
            document.write("<br>");
            document.write("Multiplication table of " + number + "<br>");

            for(var i=1; i<=10; i++)
            {
                document.write(number + " x " + i + " = " + (number*i) + "<br>");
            }
        }

        multipletable();

    </script>
</html>
