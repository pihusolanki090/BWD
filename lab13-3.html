<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootstrap Progress Bar</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 480px;">
  <h4 class="mb-4 text-center"> GYM Task Progress</h4>

  <div class="mb-3">
    <label class="form-label small">legs</label>
    <div class="progress" style="height: 1.5rem;">
      <div class="progress-bar" role="progressbar" style="width: 40%;" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">40%</div>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label small"> biceps</label>
    <div class="progress" style="height: 1.5rem;">
      <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 70%;" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100">70%</div>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label small">triceps</label>
    <div class="progress" style="height: 1.5rem;">
      <div class="progress-bar bg-triceps" role="progressbar" style="width: 55%;" aria-valuenow="55" aria-valuemin="0" aria-valuemax="100">55%</div>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label small">cores</label>
    <div class="progress" style="height: 1.5rem;">
      <div class="progress-bar bg-core" role="progressbar" style="width: 20%;" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100">20%</div>
    </div>
  </div>
</div>

</body>
</html>
