<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab 15 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        table {
            border-collapse: collapse;
            margin: 50px auto;
            width: 700px;
            height: 500px;
        }

        td {
            width: 120px;
            height: 80px;
            border: 2px solid black;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        td:hover {
            background-color: var(--color);
        }
    </style>   
</head>
    <h1><b><center>3 x 3 table by using bootstrap</center></b></h1>
    <table>
        <tr>
            <td style="--color: lightblue;">lightblue</td>
            <td style="--color: skyblue;">skyblue</td>
            <td style="--color:aqua;">aqua</td>
        </tr>

        <tr>
            <td style="--color: lightpink;">lightpink</td>
            <td style="--color: pink;">pink</td>
            <td style="--color: magenta;">magenta</td>
        </tr>

        <tr>
            <td style="--color: lightgreen;">lightgreen</td>
            <td style="--color: green;">green</td>
            <td style="--color: darkgreen;">darkgreen</td>
        </tr>
    </table>
</body>
</html>
