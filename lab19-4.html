<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- write a javascript program to check number is armstorng or not. -->
</body>

    <script>
            
            function checkArmstrong() {
                var number = prompt("Enter a number:");
                var sum = 0;
                var temp = number;
                var digits = number.length;
    
                while (temp > 0) {
                    var digit = temp % 10;
                    sum += Math.pow(digit, digits);
                    temp = Math.floor(temp / 10);
                }
    
                if (sum == number) {
                    document.write("The number " + number + " is an Armstrong number.");
                } else {
                    document.write("The number " + number + " is not an Armstrong number.");
                }
            }
    
            checkArmstrong();


    </script>
</html>
