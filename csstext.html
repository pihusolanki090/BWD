<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css text property</title>

    <style>
        h1{
            color: red;
            text-align: center;
        }
        h2{
            color: blue;
            text-decoration: underline;
        }
        h3{
            color: green;
            text-transform: uppercase;
        }
        h4{
            
            letter-spacing: 30 px;
        }

    </style>
</head>
<body>
    <h1> Hello</h1>
    <h2>I am pihu solanki</h2>
    <h3>I am student of marwadi university</h3>
    <h4>Now i am studying bca degree</h4>
    <h5>Nello world</h5>
    <h6>My class is bca -1a</h6>
</body>
</html>
