<!DOCTYPE html>

<body>
    <!-- wap that displays that check whether the number is even or odd using function -->
</body>
<script>
    function checknumber(){
        var number = prompt("Enter a number:");

        if(number % 2 ==0)
        {
            document.write("The number " + number + " is even.");
        }
         else
        {
            document.write("The number " + number + " is odd.");
        }
    }
    checknumber();


</script>
</html>
