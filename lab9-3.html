<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab9-3</title>

    <style>
        .circle
        {   
            height: 40px; 
            width: 40px;
            background-color:palevioletred;
            border: 5px solid black;
             border-radius: 50%;
        }
        .rectangle
        {
            height: 50px; 
            width: 40px;
            background-color:cadetblue;
            border: 5px solid red;
        }
        .square
        {
            height: 30px; 
            width: 30px;
            background-color: chartreuse;
             border: 5px solid grey; 

        }
        .ovel
        {
            height: 120px;
            width: 90px;
            background-color: cornflowerblue;
            border: 4px solid yellow;
            border-radius: 100px;
        }
        .triangle
        {
            height: 0px;
           width: 0px;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 60px solid  darkslategray;
            margin: 10px;

        }
    
     


    </style>
</head>
<body>
    <h1>different shapes</h1>
<div class="circle"> </div><br><br>
<div class="rectangle"></div><br><br>
<div class="square"></div><br><br>
<div class="ovel"></div><br><br>
<div class="triangle"></div>

    
</body>
</html>
