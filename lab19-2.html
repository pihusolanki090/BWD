<body>
<!-- write a javascript program to print month name based on user input using switch case. -->
</body>
        <script>

            var Month;
            Month=prompt("Enter the Month number (1-12): ");
            switch(Month)
            {
                case "1":
                    document.write("  Month is January");
                    break;
                case "2":
                    document.write("  Month is February");
                    break;
                case "3":
                    document.write("  Month is March");
                    break;
                case "4":
                    document.write(" Month is April");
                    break;
                case "5":
                    document.write(" Month is May");
                    break;
                case "6":
                    document.write(" Month is June");
                    break;
                case "7":
                    document.write("Month is July");
                    break;
                case "8":
                    document.write(" Month is August");
                    break;
                case "9":
                    document.write(" Month is September");
                    break;
                case "10":
                    document.write(" Month is October");
                    break;
                case "11":
                    document.write(" Month is November");
                    break;
                case "12":
                    document.write(" Month is December");
                    break;
                default:
                    document.write("Invalid Month number. Please enter a number between 1 and 12.");
            }


        </script>
</html>
