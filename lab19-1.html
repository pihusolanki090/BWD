<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab19-1</title>
</head>
<body>
    <!-- write a javascript program to print pyramid structure using while loop. -->
</body>
    <script>
        var i=1;
        var j=1;
        var N;

        N=prompt("Enter the number of rows for pyramid structure: ");

        while(i<=N)
        {
            j=1;
            while(j<=i)
            {
                document.write(" * ");
                j++;
            }
            document.write("<br>");
            i++;
        }

    </script>
</html>
